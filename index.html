<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs Not Finished Meme Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="title">jobs not finished meme generator</h1>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="imageTab">Image</button>
            <button class="tab-btn" data-tab="videoTab">Video</button>
        </div>

        <div id="imageTab" class="tab-content">
            <div id="memeCanvas" class="meme-canvas">
                <div class="meme-top">
                    <div id="memeText" class="meme-text"></div>
                </div>
                <img src="https://i.kym-cdn.com/photos/images/original/001/456/789/5a1.jpg" 
                     alt="Kobe meme template" 
                     class="meme-image">
            </div>

            <div class="generator-section">
                <input type="text" 
                       id="userInput" 
                       class="meme-input" 
                       placeholder="Enter your meme text..." 
                       maxlength="100">
                
                <div class="button-stack">
                    <button id="generateBtn" class="btn">GENERATE MEME</button>
                    <button id="downloadBtn" class="btn">DOWNLOAD MEME</button>
                </div>
            </div>
        </div>

        <div id="videoTab" class="video-generator tab-content hidden">
            <div class="video-layout">
                <div class="preview-section">
                    <canvas id="videoPreview"></canvas>
                </div>

                <div class="controls-section">
                    <h2>Controls</h2>

                    <div class="control-group">
                        <label class="control-label">Background</label>
                        <div class="bg-buttons">
                            <button class="bg-btn active" data-bg="background-1.webp">BG 1</button>
                            <button class="bg-btn" data-bg="background-2.png">BG 2</button>
                            <label class="upload-label">
                                Upload Custom
                                <input type="file" id="bgUpload" accept="image/*" style="display: none;">
                            </label>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">Caption</label>
                        <input type="text" 
                               id="videoCaption" 
                               class="caption-input" 
                               placeholder="Enter caption text..." 
                               value="JOBS NOT FINISHED">
                        
                        <div class="caption-controls">
                            <select id="captionPosition">
                                <option value="top">Top</option>
                                <option value="bottom">Bottom</option>
                            </select>
                            <input type="color" id="captionColor" value="#000000">
                            <input type="number" 
                                   id="captionSize" 
                                   class="caption-size" 
                                   min="24" 
                                   max="96" 
                                   value="48">
                        </div>
                    </div>

                    <button id="generateVideoBtn" class="generate-btn">GENERATE MEME MP4</button>

                    <div id="statusText" class="status-text"></div>

                    <button id="downloadVideoBtn" class="download-btn hidden">DOWNLOAD MP4</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="laughTrack" style="display: none;"></audio>
    <video id="sourceVideo" style="display: none;" loop muted playsinline crossorigin="anonymous"></video>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
