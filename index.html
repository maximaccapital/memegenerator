<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOBS NOT FINISHED MEME GENERATOR</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="title">jobs not finished meme generator</h1>
        </div>
        <div class="tab-toggle">
            <button class="tab-btn active" data-tab="imageTab">Image</button>
            <button class="tab-btn" data-tab="videoTab">Video</button>
        </div>
        <div id="imageTab" class="meme-container">
            <div id="memeCanvas" class="meme-canvas">
                <div class="meme-top">
                    <div id="memeText" class="meme-text"></div>
                </div>
                <img src="https://i.kym-cdn.com/photos/images/original/001/456/789/5a1.jpg" alt="Kobe meme" class="meme-image">
            </div>
        </div>
        <div id="videoTab" class="video-generator hidden">
            <div class="video-layout">
                <div class="video-preview-section">
                    <canvas id="videoPreview"></canvas>
                </div>
                <div class="video-controls-section">
                    <h2>Controls</h2>
                    <div class="control-group">
                        <label class="control-label">Background</label>
                        <div class="bg-buttons">
                            <button id="bgDefault1" class="bg-button">BG 1</button>
                            <button id="bgDefault2" class="bg-button">BG 2</button>
                        </div>
                        <label class="upload-label">
                            Upload Custom
                            <input type="file" id="bgUpload" accept="image/*" style="display:none">
                        </label>
                    </div>
                    <div class="control-group">
                        <label class="control-label">Caption</label>
                        <input id="videoCaption" type="text" placeholder="Enter caption..." class="caption-input" value="JOBS NOT FINISHED">
                        <div class="caption-controls">
                            <select id="captionPosition" class="caption-position">
                                <option value="top">Top</option>
                                <option value="bottom">Bottom</option>
                            </select>
                            <input id="captionColor" type="color" value="#000000" class="caption-color">
                            <input id="captionSize" type="number" min="24" max="96" value="48" class="caption-size" placeholder="Size">
                        </div>
                    </div>
                    <button id="generateVideoBtn" class="generate-btn">Generate Meme MP4</button>
                    <div id="renderStatus" class="render-status"></div>
                    <button id="downloadVideoBtn" class="download-btn hidden">Download MP4</button>
                </div>
            </div>
        </div>
        <div class="generator">
            <input id="userInput" type="text" placeholder="Enter your jobs not finished meme text...">
            <div class="buttons">
                <button id="generateBtn">Generate Meme</button>
                <button id="downloadBtn">Download Meme</button>
            </div>
        </div>
        <div id="laughTrack" class="laughs"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
